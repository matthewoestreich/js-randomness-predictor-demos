<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-randomness-predictor Demos</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        background: #f9f9f9;
        color: #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        justify-content: flex-start;
        padding: 2rem 1rem;
        text-align: center;
      }
      a {
        color: #1d4ed8;
        text-decoration: none;
        transition: color 0.2s;
      }
      a:hover {
        color: #2563eb;
        text-decoration: underline;
      }
      h1 {
        margin: 1.5rem 0;
        font-size: 2rem;
      }
      p {
        margin-bottom: 2rem;
        font-size: 1rem;
        max-width: 600px;
      }
      ul {
        list-style-type: none;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 0;
        width: 100%;
        max-width: 1200px;
        justify-content: center;
      }
      li {
        flex: 1 1 calc(20% - 1rem);
        min-width: 150px;
      }
      li a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.5rem;
        background: #fff;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        font-weight: 500;
        transition: all 0.2s;
        text-align: center;
      }
      li a:hover {
        background: #f3f4f6;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .icon-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      code {
        background: #f3f4f6;
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        font-family: monospace;
        font-size: 0.95em;
      }
      .heading-link {
        margin: 0px 0px 6px 0px;
      }
      .demos-list {
        margin-top: 3rem;
      }

      @media (max-width: 800px) {
        li {
          flex: 1 1 calc(50% - 1rem);
        }
      }
      @media (max-width: 500px) {
        li {
          flex: 1 1 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>js-randomness-predictor Demos</h1>

    </p>

    </p>
    <ul class="demos-list">

      </li>
      <li>
        <a href="react-vite/index.html">

      <li>

      </li>
      <li>
        <a href="vue-vite/index.html">

            <iconify-icon icon="logos:vitejs" width="32"></iconify-icon>
          </div>
          Vue + Vite

      </li>
      <li>
        <a href="solidjs-vite/index.html">

            <iconify-icon icon="logos:vitejs" width="32"></iconify-icon>
          </div>
          SolidJS + Vite

      <li>

        </a>
      </li>
      <li>
        <a href="https://github.com/matthewoestreich/js-randomness-predictor-demos/tree/main/bun">
          <div class="icon-row">
            <iconify-icon icon="logos:bun" width="32"></iconify-icon>
          </div>

        </a>
      </li>
      <li>
        <a href="https://github.com/matthewoestreich/js-randomness-predictor-demos/tree/main/deno">
          <div class="icon-row">
            <iconify-icon icon="logos:deno" width="32"></iconify-icon>
          </div>
          Deno (source code)
        </a>
      </li>
    </ul>
  </body>
</html>
